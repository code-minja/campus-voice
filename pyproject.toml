[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campus-voice"
version = "0.1.0"
description = "Campus Voice - AI Voice Assistant Backend"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",

    # STT — faster-whisper uses CTranslate2 under the hood.
    # PyAV (bundled with faster-whisper) ships its own FFmpeg — no system install.
    # Minimum bounds only; Docker (Linux x86_64) resolves to the latest compatible.
    "faster-whisper>=1.1.1",
    "ctranslate2>=4.5.0",

    # TTS — kokoro-onnx: pure ONNX, no PyTorch, no transformers
    "kokoro-onnx>=0.4.9",
    "soundfile>=0.12.1",

    # numpy 2.x required by kokoro-onnx; ctranslate2>=4.5 supports it
    "numpy>=2.0.2",

    # Utilities
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/campus_voice"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
